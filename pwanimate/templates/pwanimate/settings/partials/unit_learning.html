{% load i18n static %}
<section class="spark-unit-learning pwanimate-settings-section mt-4 pt-4 border-top">
    <h6 class="fw-semibold">{% trans "Academic unit study records" %}</h6>
    <p class="small text-muted">{% trans "Tracking is separate from personal memory. Each unit needs your approval first. Earlier messages are never imported. Changing this preference revokes existing authorizations; saved history stays available." %}</p>
    <label class="form-label small">{% trans "Unit tracking preference" %}
        <select class="form-select" data-unit="mode" disabled>
            <option value="ask">{% trans "Ask for each session or conversation" %}</option>
            <option value="automatic">{% trans "Automatically continue units I authorize" %}</option>
            <option value="disabled">{% trans "Disabled" %}</option>
        </select>
    </label>
    <p class="small text-muted" data-unit="status" role="status" aria-live="polite"></p>
    <div data-unit="enrollments"></div>
    <div data-unit="records" class="mt-3"></div>
    <div data-unit="history" class="mt-3"></div>
</section>
<script src="{% static 'js/spark-unit-learning.js' %}"></script>
