{% load i18n %}
<div class="spark-study-sessions pwanimate-settings-form" data-sessions-root>
    <div class="d-flex align-items-start justify-content-between gap-3 flex-wrap mb-3">
        <div>
            <h4 class="fw-bold mb-1">{% trans "Study Sessions" %}</h4>
            <p class="text-muted small mb-0">{% trans "Every enrolled unit keeps its own session, roadmap, and tested progress." %}</p>
        </div>
        <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill d-inline-flex align-items-center gap-1" data-sessions="refresh">
            <i data-lucide="rotate-cw"></i><span>{% trans "Refresh" %}</span>
        </button>
    </div>
    <p data-sessions="status" class="small text-muted" role="status" aria-live="polite"></p>
    <ul class="nav nav-pills nav-fill pwanimate-settings-nav-pills p-1 rounded-pill gap-1 mb-3" data-sessions="filters" style="max-width: 380px;">
        <li class="nav-item flex-fill">
            <button type="button" class="nav-link rounded-pill py-2 active" data-filter="progress">
                <span>{% trans "In progress" %}</span>
            </button>
        </li>
        <li class="nav-item flex-fill">
            <button type="button" class="nav-link rounded-pill py-2" data-filter="completed">
                <span>{% trans "Completed" %}</span>
            </button>
        </li>
        <li class="nav-item flex-fill">
            <button type="button" class="nav-link rounded-pill py-2" data-filter="all">
                <span>{% trans "All" %}</span>
            </button>
        </li>
    </ul>
    <div data-sessions="list" class="d-flex flex-column gap-3"></div>
</div>
