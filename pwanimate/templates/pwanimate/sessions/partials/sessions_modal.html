{% load i18n %}
{% load static %}
<div class="modal fade pwanimate-settings-modal pwanimate-sessions-modal"
     id="pwanimateSessionsModal"
     tabindex="-1"
     aria-labelledby="pwanimateSessionsModalTitle"
     aria-hidden="true"
     data-bs-backdrop="true"
     data-bs-keyboard="true">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
        <div class="modal-content shadow-lg border rounded-4 overflow-hidden" style="background-color: var(--pwanimate-sidebar-bg);">
            <div class="modal-header border-bottom px-4 py-3 d-flex align-items-center justify-content-between" style="border-color: var(--pwanimate-border) !important;">
                <div class="d-flex align-items-center gap-2">
                    <i data-lucide="book-open-check" class="text-primary fs-5"></i>
                    <h5 class="modal-title fw-bold mb-0" id="pwanimateSessionsModalTitle">
                        {% trans "Study Sessions" %}
                    </h5>
                </div>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="{% trans 'Close' %}"
                        style="filter: var(--pwanimate-close-filter, none);"></button>
            </div>
            <div class="modal-body p-4 pwanimate-settings-main" id="pwanimate-sessions-modal-body">
                {% include 'pwanimate/sessions/partials/sessions_content.html' %}
            </div>
        </div>
    </div>
</div>
