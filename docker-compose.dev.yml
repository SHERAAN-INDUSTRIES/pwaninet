# Standalone, isolated developer stack. Use scripts/setup-docker.sh.
x-backend: &backend
  build: .
  image: pwaninet-dev-backend
  env_file: .env.docker-dev
  environment:
    DJANGO_SETTINGS_MODULE: pwaninet.settings.docker
    DB_HOST: db
    DB_PORT: '5432'
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    REDIS_URL: redis://redis:6379/1
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    USE_S3: '0'
    LOCAL_BACKEND_URL: http://127.0.0.1:${WEB_HOST_PORT:-8000}
  volumes:
    - dev_static:/app/staticfiles
    - dev_media:/app/media
    - dev_private_media:/app/private_media
    - ./.secrets/docker-dev-oidc.pem:/run/secrets/oidc.pem:ro
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: ${DB_NAME:-pwaninet_dev}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/setup-docker.sh first}
    shm_size: 256mb
    volumes:
      - dev_postgres:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy volatile-lru
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30
  web:
    <<: *backend
    command: uvicorn pwaninet.asgi:application --host 0.0.0.0 --port 8000
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-8000}:8000'
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', '--max-time', '5', 'http://127.0.0.1:8000/api/health/']
      interval: 5s
      timeout: 6s
      retries: 30
      start_period: 20s
  celery_worker:
    <<: *backend
    command: celery -A pwaninet worker -l info --concurrency=2 -Q default,media_queue,docs_queue,search_queue
  celery_beat:
    <<: *backend
    command: celery -A pwaninet beat -l info --schedule=/tmp/celerybeat-schedule

volumes:
  dev_static:
  dev_postgres:
  dev_media:
  dev_private_media:
